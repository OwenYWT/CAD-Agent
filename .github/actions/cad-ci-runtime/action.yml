name: Prepare isolated CAD test runtime
description: Install locked dependencies and verify images from this workflow attempt.
runs:
  using: composite
  steps:
  - name: Record runtime preparation before installing dependencies
    shell: bash
    run: python3 scripts/ci/job_metadata.py "${CAD_CI_JOB:?}" "${CAD_CI_REPORT_ROOT:?}/setup"
  - name: Reserve disk for native images and test services
    shell: bash
    run: bash scripts/ci/prepare_hosted_runner.sh 2>&1 | tee "$CAD_CI_REPORT_ROOT/setup/disk.log"
  - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
    with:
      python-version-file: .python-version
      cache: pip
      cache-dependency-path: backend/requirements-ci.lock
  - name: Install locked test dependencies
    run: python -m pip install -r backend/requirements-ci.lock 2>&1 | tee "$CAD_CI_REPORT_ROOT/setup/dependencies.log"
    shell: bash
  - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
    with:
      name: cad-ci-images-${{ github.run_id }}-${{ github.run_attempt }}
      path: ${{ runner.temp }}/cad-ci-images
  - name: Load only source-verified CAD images
    shell: bash
    run: python scripts/ci/image_manifest.py load "$RUNNER_TEMP/cad-ci-images" 2>&1 | tee "$CAD_CI_REPORT_ROOT/setup/images.log"
  - name: Remove verified archive copies after loading
    shell: bash
    run: |-
      for image in sandbox object-store backend frontend; do
        rm "$RUNNER_TEMP/cad-ci-images/$image.tar"
      done
      df -h /
