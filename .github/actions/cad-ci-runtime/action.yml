name: Prepare isolated CAD test runtime
description: Install locked dependencies and verify images from this workflow attempt.
runs:
  using: composite
  steps:
  - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
    with:
      python-version-file: .python-version
      cache: pip
      cache-dependency-path: backend/requirements-ci.lock
  - name: Install locked test dependencies
    run: python -m pip install -r backend/requirements-ci.lock
    shell: bash
  - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
    with:
      name: cad-ci-images-${{ github.run_id }}-${{ github.run_attempt }}
      path: ${{ runner.temp }}/cad-ci-images
  - name: Load only source-verified CAD images
    shell: bash
    run: python scripts/ci/image_manifest.py load "$RUNNER_TEMP/cad-ci-images"
