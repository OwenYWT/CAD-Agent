name: Manual live model evaluation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cad-agent-live-evaluation
  cancel-in-progress: false
jobs:
  live:
    name: Paid model regression (separate from PR gate)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: cad-evaluation
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APP_ENVIRONMENT: test
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      CAD_CI_SCOPE: cad-ci-live-${{ github.run_id }}-${{ github.run_attempt }}
      CAD_CI_ENV_FILE: /tmp/cad-ci-${{ github.run_id }}-${{ github.run_attempt }}-live.env
      CAD_EVAL_CURRENCY: ${{ vars.CAD_EVAL_CURRENCY }}
      CAD_EVAL_RUN_LIMIT: ${{ vars.CAD_EVAL_RUN_LIMIT }}
      CAD_EVAL_MONTH_LIMIT: ${{ vars.CAD_EVAL_MONTH_LIMIT }}
      CAD_EVAL_MAX_CALLS: ${{ vars.CAD_EVAL_MAX_CALLS }}
      CAD_EVAL_MODEL: ${{ vars.CAD_EVAL_MODEL }}
      CAD_EVAL_CONTEXT_TOKENS: ${{ vars.CAD_EVAL_CONTEXT_TOKENS }}
      CAD_EVAL_OUTPUT_TOKENS: ${{ vars.CAD_EVAL_OUTPUT_TOKENS }}
      CAD_EVAL_INPUT_PRICE_PER_MILLION: ${{ vars.CAD_EVAL_INPUT_PRICE_PER_MILLION }}
      CAD_EVAL_OUTPUT_PRICE_PER_MILLION: ${{ vars.CAD_EVAL_OUTPUT_PRICE_PER_MILLION }}
      CAD_EVAL_PROVIDER_URL: ${{ vars.CAD_EVAL_PROVIDER_URL }}
      CAD_EVAL_LEDGER_ENDPOINT: ${{ vars.CAD_EVAL_LEDGER_ENDPOINT }}
      CAD_EVAL_LEDGER_BUCKET: ${{ vars.CAD_EVAL_LEDGER_BUCKET }}
      CAD_EVAL_LEDGER_ACCESS_KEY: ${{ secrets.CAD_EVAL_LEDGER_ACCESS_KEY }}
      CAD_EVAL_LEDGER_SECRET_KEY: ${{ secrets.CAD_EVAL_LEDGER_SECRET_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.CAD_EVAL_PROVIDER_KEY }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - name: Install locked evaluation dependencies
      run: python -m pip install -r backend/requirements-ci.lock
    - name: Require explicit costs and isolated credentials
      run: python scripts/ci/live_contract.py preflight
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Verify object store binary releases
      run: bash scripts/ci/prepare_object_store.sh "$RUNNER_TEMP/cad-ci-object-store"
    - name: Build isolated sandbox
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: backend/sandbox/Dockerfile
        platforms: linux/amd64
        tags: cad-agent-sandbox:live-${{ github.sha }}
        load: true
        cache-from: type=gha,scope=cad-ci-sandbox-amd64
        cache-to: type=gha,scope=cad-ci-sandbox-amd64,mode=max,ignore-error=true
    - name: Build isolated object-store
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: ${{ runner.temp }}/cad-ci-object-store
        file: ${{ runner.temp }}/cad-ci-object-store/Dockerfile
        platforms: linux/amd64
        tags: cad-agent-object-store:live-${{ github.sha }}
        load: true
        cache-from: type=gha,scope=cad-ci-object-store-amd64
        cache-to: type=gha,scope=cad-ci-object-store-amd64,mode=max,ignore-error=true
    - name: Start owned services
      run: SANDBOX_IMAGE="cad-agent-sandbox:live-$GITHUB_SHA" CAD_CI_OBJECT_STORE_IMAGE="cad-agent-object-store:live-$GITHUB_SHA"
        bash scripts/ci/services.sh up
    - name: Run actual provider and native CAD cases
      run: python scripts/ci/live_contract.py run --report "$GITHUB_WORKSPACE/reports/live"
    - name: "Remove only this run\u2019s owned services"
      if: always()
      run: bash scripts/ci/services.sh down
    - name: Retain actual test and cost evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cad-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/live/
        if-no-files-found: error
        retention-days: 30
