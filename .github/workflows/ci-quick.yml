name: Quick CI
'on':
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  APP_ENVIRONMENT: test
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Quick backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAD_CI_JOB: backend
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/backend
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - name: Install locked test dependencies
      run: python -m pip install -r backend/requirements-ci.lock
    - name: Run shared quick entry
      run: bash scripts/ci/run.sh quick backend
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-backend-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  frontend:
    name: Quick frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAD_CI_JOB: frontend
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/frontend
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci --prefix frontend
    - name: Run shared quick entry
      run: bash scripts/ci/run.sh quick frontend
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  architecture-contract:
    name: Quick architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAD_CI_JOB: architecture-contract
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/architecture-contract
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - run: python -m pip install PyYAML==6.0.3
    - name: Run shared quick entry
      run: bash scripts/ci/run.sh quick architecture
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-architecture-contract-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
