name: CI
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  merge_group:
    types:
    - checks_requested
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  APP_ENVIRONMENT: test
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAD_CI_JOB: backend
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/backend
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - name: Install locked test dependencies
      run: python -m pip install -r backend/requirements-ci.lock
    - name: Run shared quick entry
      run: bash scripts/ci/run.sh quick backend
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-backend-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAD_CI_JOB: frontend
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/frontend
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci --prefix frontend
    - name: Run shared quick entry
      run: bash scripts/ci/run.sh quick frontend
    - name: Retain tested frontend assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cad-ci-dist-${{ github.run_id }}-${{ github.run_attempt }}
        path: frontend/dist/
        if-no-files-found: error
        retention-days: 1
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  architecture-contract:
    name: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAD_CI_JOB: architecture-contract
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/architecture-contract
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - run: python -m pip install PyYAML==6.0.3
    - name: Run shared quick entry
      run: bash scripts/ci/run.sh quick architecture
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-architecture-contract-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  build-images:
    name: Build and verify runtime and delivery images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - backend
    - frontend
    - architecture-contract
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Reserve disk for the native build and image archives
      run: bash scripts/ci/prepare_hosted_runner.sh
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - name: Record image job identity
      run: |-
        python scripts/ci/job_metadata.py build-images reports/build-images
        mkdir -p "$RUNNER_TEMP/cad-ci-images"
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: cad-ci-dist-${{ github.run_id }}-${{ github.run_attempt }}
        path: frontend/dist
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      id: cad-builder
    - name: Verify pinned object-store releases
      run: bash scripts/ci/prepare_object_store.sh "$RUNNER_TEMP/cad-ci-object-store"
    - name: Build sandbox from pinned inputs
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: backend/sandbox/Dockerfile
        platforms: linux/amd64
        tags: cad-agent-sandbox:ci-${{ github.sha }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        outputs: type=docker,dest=${{ runner.temp }}/cad-ci-images/sandbox.tar
        cache-from: type=gha,scope=cad-ci-sandbox-amd64
        cache-to: type=gha,scope=cad-ci-sandbox-amd64,mode=max,ignore-error=true
    - name: Build object-store from pinned inputs
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: ${{ runner.temp }}/cad-ci-object-store
        file: ${{ runner.temp }}/cad-ci-object-store/Dockerfile
        platforms: linux/amd64
        tags: cad-agent-object-store:ci-${{ github.sha }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        outputs: type=docker,dest=${{ runner.temp }}/cad-ci-images/object-store.tar
        cache-from: type=gha,scope=cad-ci-object-store-amd64
        cache-to: type=gha,scope=cad-ci-object-store-amd64,mode=max,ignore-error=true
    - name: Build backend from pinned inputs
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: backend/Dockerfile
        platforms: linux/amd64
        tags: cad-agent-backend:ci-${{ github.sha }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        outputs: type=docker,dest=${{ runner.temp }}/cad-ci-images/backend.tar
        cache-from: type=gha,scope=cad-ci-backend-amd64
        cache-to: type=gha,scope=cad-ci-backend-amd64,mode=max,ignore-error=true
    - name: Build frontend from pinned inputs
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: frontend
        file: deploy/tencent/Dockerfile.frontend
        platforms: linux/amd64
        tags: cad-agent-frontend:ci-${{ github.sha }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        outputs: type=docker,dest=${{ runner.temp }}/cad-ci-images/frontend.tar
        cache-from: type=gha,scope=cad-ci-frontend-amd64
        cache-to: type=gha,scope=cad-ci-frontend-amd64,mode=max,ignore-error=true
    - name: Bind image archives to the source commit
      run: |-
        python scripts/ci/image_manifest.py create "$RUNNER_TEMP/cad-ci-images"
        cp "$RUNNER_TEMP/cad-ci-images/images.json" reports/build-images/images.json
    - name: Release this job's exported build layers before the native probe
      run: |-
        docker buildx prune --builder "${{ steps.cad-builder.outputs.name }}" --all --force
        df -h /
    - name: Validate real sandbox runtime
      run: |-
        python scripts/ci/image_manifest.py load "$RUNNER_TEMP/cad-ci-images" --images sandbox
        docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 512 --memory 4g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=2g --entrypoint python "cad-agent-sandbox:ci-$GITHUB_SHA" /opt/cad-agent/runtime_probe.py --json > reports/build-images/runtime-probe.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cad-ci-images-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/cad-ci-images/
        if-no-files-found: error
        compression-level: 1
        retention-days: 1
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-build-images-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  mcad-core:
    name: mcad-core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build-images
    env:
      CAD_CI_JOB: mcad-core
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/mcad-core
      CAD_CI_SCOPE: cad-ci-core-${{ github.run_id }}-${{ github.run_attempt }}
      CAD_CI_ENV_FILE: /tmp/cad-ci-${{ github.run_id }}-${{ github.run_attempt }}-core.env
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/cad-ci-runtime
    - name: Create isolated data and workflow services
      run: bash scripts/ci/services.sh up
    - name: Run all core contracts
      run: bash scripts/ci/run.sh core
    - name: Validate mandatory job evidence
      run: python scripts/ci/require_runtime_evidence.py reports --job mcad-core
    - name: Retain service logs
      if: always()
      run: |-
        mkdir -p "$CAD_CI_REPORT_ROOT/services"
        for service in postgres minio temporal; do docker logs "$CAD_CI_SCOPE-$service" > "$CAD_CI_REPORT_ROOT/services/$service.log" 2>&1 || true; done
    - name: Clean up only owned CI resources
      if: always()
      run: bash scripts/ci/services.sh down
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-mcad-core-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  model-lifecycle:
    name: model-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build-images
    env:
      CAD_CI_JOB: model-lifecycle
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/model-lifecycle
      CAD_CI_SCOPE: cad-ci-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
      CAD_CI_ENV_FILE: /tmp/cad-ci-${{ github.run_id }}-${{ github.run_attempt }}-lifecycle.env
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/cad-ci-runtime
    - name: Select unchanged released-source baseline
      run: |-
        git worktree add --detach "$RUNNER_TEMP/cad-release-baseline" 62084d5c84ead7bcd88030695fdfcd61112280ea
        printf 'CAD_CI_RELEASE_BASELINE=%s\n' "$RUNNER_TEMP/cad-release-baseline" >> "$GITHUB_ENV"
    - name: Create isolated data and workflow services
      run: bash scripts/ci/services.sh up
    - name: Run all lifecycle contracts
      run: bash scripts/ci/run.sh lifecycle
    - name: Validate mandatory job evidence
      run: python scripts/ci/require_runtime_evidence.py reports --job model-lifecycle
    - name: Retain service logs
      if: always()
      run: |-
        mkdir -p "$CAD_CI_REPORT_ROOT/services"
        for service in postgres minio temporal; do docker logs "$CAD_CI_SCOPE-$service" > "$CAD_CI_REPORT_ROOT/services/$service.log" 2>&1 || true; done
    - name: Clean up only owned CI resources
      if: always()
      run: bash scripts/ci/services.sh down
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-model-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build-images
    env:
      CAD_CI_JOB: browser-e2e
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/browser-e2e
      CAD_CI_SCOPE: cad-ci-browser-${{ github.run_id }}-${{ github.run_attempt }}
      CAD_CI_ENV_FILE: /tmp/cad-ci-${{ github.run_id }}-${{ github.run_attempt }}-browser.env
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/cad-ci-runtime
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: |-
        npm ci --prefix frontend
        python -m playwright install --with-deps chromium
    - name: Create isolated data and workflow services
      run: bash scripts/ci/services.sh up
    - name: Run all browser contracts
      run: bash scripts/ci/run.sh browser
    - name: Validate mandatory job evidence
      run: python scripts/ci/require_runtime_evidence.py reports --job browser-e2e
    - name: Retain service logs
      if: always()
      run: |-
        mkdir -p "$CAD_CI_REPORT_ROOT/services"
        for service in postgres minio temporal; do docker logs "$CAD_CI_SCOPE-$service" > "$CAD_CI_REPORT_ROOT/services/$service.log" 2>&1 || true; done
    - name: Clean up only owned CI resources
      if: always()
      run: bash scripts/ci/services.sh down
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  deploy-smoke:
    name: deploy-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build-images
    env:
      CAD_CI_JOB: deploy-smoke
      CAD_CI_REPORT_ROOT: ${{ github.workspace }}/reports/deploy-smoke
      CAD_CI_SCOPE: cad-ci-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      CAD_CI_ENV_FILE: /tmp/cad-ci-${{ github.run_id }}-${{ github.run_attempt }}-deploy.env
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/cad-ci-runtime
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: |-
        npm ci --prefix frontend
        python -m playwright install --with-deps chromium
    - name: Run all deploy contracts
      run: bash scripts/ci/run.sh deploy
    - name: Validate mandatory job evidence
      run: python scripts/ci/require_runtime_evidence.py reports --job deploy-smoke
    - name: Upload job evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cad-ci-evidence-deploy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/
        if-no-files-found: error
        retention-days: 7
  regression-gate:
    name: Required regression gate
    if: always()
    needs:
    - backend
    - frontend
    - architecture-contract
    - build-images
    - mcad-core
    - model-lifecycle
    - browser-e2e
    - deploy-smoke
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: backend/requirements-ci.lock
    - name: Download evidence from this exact workflow attempt
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      if: always()
      with:
        pattern: cad-ci-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports
        merge-multiple: true
    - name: Require every job, test identity and receipt
      if: always()
      run: python scripts/ci/require_regression.py reports
