name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests (no Docker, no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hermetic test suite
        working-directory: backend
        # Excludes tests needing a Docker daemon or a live LLM key. The hermetic
        # e2e suite (tests/test_e2e_pipeline.py) + printability gate run here and
        # MUST be green. Any non-skip failure fails the build.
        run: pytest -m "not docker and not llm" -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck (app code) + build
        working-directory: frontend
        # NOTE: must use -p tsconfig.app.json — the root tsconfig has "files":[]
        # and does not check app source.
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx vite build
