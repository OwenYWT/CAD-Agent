name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests (no Docker, no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run hermetic test suite
        working-directory: backend
        # Excludes tests needing a Docker daemon or a live LLM key. The hermetic
        # e2e suite (tests/test_e2e_pipeline.py) + printability gate run here and
        # MUST be green. Any non-skip failure fails the build.
        run: python -m pytest -m "not docker and not llm and not fusion_e2e" -q

      - name: Fusion connector schemas and Add-in syntax
        run: |
          python scripts/fusion360/generate_schema.py --check
          python -m compileall -q backend/app/fusion360 fusion_addin/CADAgentFusionConnector scripts/fusion360
          for script in scripts/fusion360/*.sh; do bash -n "$script"; done

      - name: Fusion connector hermetic contract suite
        working-directory: backend
        run: PYTHONPATH=.. python -m pytest tests/fusion360 -m "not fusion_e2e" -q

  frontend:
    name: Frontend lint + tests + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck (app + QA code) + build
        working-directory: frontend
        # NOTE: must use -p tsconfig.app.json — the root tsconfig has "files":[]
        # and does not check app or QA source.
        run: |
          npm run lint
          node --test --experimental-strip-types tests/*.test.ts
          npx tsc --noEmit -p tsconfig.app.json
          npx vite build

  mcad-runtime:
    name: Real MCAD runtime + durable control-plane E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build pinned MCAD worker image
        run: docker build -f backend/sandbox/Dockerfile -t cad-agent-sandbox:ci .

      - name: Probe real CAD, inspect, render, and export operations
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 512 \
            --memory 4g \
            --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --entrypoint python \
            cad-agent-sandbox:ci \
            /opt/cad-agent/runtime_probe.py --json

      - name: Start PostgreSQL, MinIO, and Temporal
        env:
          POSTGRES_PASSWORD: task11-ci-postgres-secret
          MINIO_ROOT_USER: task11ci
          MINIO_ROOT_PASSWORD: task11-ci-minio-secret
        run: |
          docker network create cad-agent-ci
          docker run -d --name cad-agent-postgres \
            --network cad-agent-ci \
            -e POSTGRES_DB=cad_agent \
            -e POSTGRES_USER=cad_agent \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -p 127.0.0.1:55432:5432 \
            postgres:16.14-alpine3.24
          for attempt in {1..60}; do
            if docker exec cad-agent-postgres \
              pg_isready -U cad_agent -d cad_agent; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done

          docker run -d --name cad-agent-minio \
            --network cad-agent-ci \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            -p 127.0.0.1:59000:9000 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data
          for attempt in {1..60}; do
            if curl --fail --silent \
              http://127.0.0.1:59000/minio/health/live; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          docker run --rm --network cad-agent-ci \
            --entrypoint /bin/sh \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -ec '
              mc alias set local http://cad-agent-minio:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/cad-agent-artifacts
              mc version enable local/cad-agent-artifacts
            '

          docker run -d --name cad-agent-temporal \
            --network cad-agent-ci \
            -e DB=postgres12 \
            -e DB_PORT=5432 \
            -e POSTGRES_SEEDS=cad-agent-postgres \
            -e POSTGRES_USER=cad_agent \
            -e POSTGRES_PWD="$POSTGRES_PASSWORD" \
            -e DEFAULT_NAMESPACE=default \
            -p 127.0.0.1:57233:7233 \
            temporalio/auto-setup:1.29.7
          for attempt in {1..120}; do
            if docker exec cad-agent-temporal \
              temporal operator cluster health \
              --address cad-agent-temporal:7233; then
              break
            fi
            test "$attempt" -lt 120
            sleep 1
          done

      - name: Migrate clean control-plane database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cad_agent:task11-ci-postgres-secret@127.0.0.1:55432/cad_agent
        run: alembic upgrade head

      - name: Run real durable MCAD integration gate
        working-directory: backend
        env:
          CAD_AGENT_TEST_DATABASE_URL: postgresql+asyncpg://cad_agent:task11-ci-postgres-secret@127.0.0.1:55432/cad_agent
          CAD_AGENT_TEST_OBJECT_STORE: "1"
          CAD_AGENT_TEST_TEMPORAL: "1"
          TEMPORAL_TARGET: 127.0.0.1:57233
          OBJECT_STORE_ENDPOINT_URL: http://127.0.0.1:59000
          OBJECT_STORE_ACCESS_KEY: task11ci
          OBJECT_STORE_SECRET_KEY: task11-ci-minio-secret
          OBJECT_STORE_BUCKET: cad-agent-artifacts
          SANDBOX_RUNTIME: docker
          SANDBOX_COMMAND: docker
          SANDBOX_IMAGE: cad-agent-sandbox:ci
        run: |
          python -m pytest -q \
            tests/integration/test_temporal_mcadd_workflow.py \
            tests/integration/test_websocket_replay.py \
            tests/integration/test_change_set_api.py \
            tests/integration/test_postgres_project_files.py \
            tests/integration/test_api_compatibility_matrix.py
