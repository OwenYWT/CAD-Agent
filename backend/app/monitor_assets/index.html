<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD Agent · 使用监控</title><link rel="stylesheet" href="assets/style.css"><script src="assets/monitor.js" defer></script></head>
<body><header><div><small>CAD AGENT / ADMIN</small><h1>账号使用监控</h1></div><button id="logout" hidden>退出登录</button></header>
<main><section id="login"><h2>管理员登录</h2><p>独立于 CAD 工作区，仅平台管理员可访问使用数据。</p><form id="login-form"><label>账号<input name="phone" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录监控面板</button></form></section>
<p id="error" role="alert" hidden></p>
<div id="dashboard" hidden><section class="filters"><label>开始日期<input id="start" type="date" required></label><label>结束日期（含当天）<input id="end" type="date" required></label><button id="refresh">刷新数据</button><span id="updated" aria-live="polite"></span></section>
<p class="note" id="coverage"></p><p class="note">任务状态来自任务数据库；调用成功仅表示模型服务已返回，不代表 CAD 任务成功。Token 只累计服务实际返回的用量，未知用量不按 0 计算。费用未计价。未结束调用可能仍在执行或记录中断。</p>
<section id="stats" class="stats" aria-label="使用概览"></section>
<section><h2>各账号使用情况</h2><div class="scroll"><table><thead><tr><th>账号</th><th>任务数</th><th>成功 / 失败</th><th>处理中 / 取消</th><th>模型调用</th><th>调用失败 / 截断</th><th>输入 / 输出 Token</th><th>已知总 Token</th><th>用量未知</th><th>平均调用耗时</th><th>最近使用</th></tr></thead><tbody id="accounts"></tbody></table></div></section>
<section><div class="section-head"><h2 id="details-title">全部账号明细</h2><button id="clear-account" hidden>查看全部账号</button></div><nav aria-label="明细类型"><button id="tasks-tab" aria-pressed="true">任务记录</button><button id="calls-tab" aria-pressed="false">模型调用</button></nav><div class="scroll"><table><thead id="detail-head"></thead><tbody id="details"></tbody></table></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>
</div></main></body></html>
