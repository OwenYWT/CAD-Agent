[pytest]
# asyncio: explicit @pytest.mark.asyncio (strict) — matches existing tests.
asyncio_mode = strict
markers =
    unit: pure unit tests, no external deps
    docker: requires Docker daemon running
    llm: requires DASHSCOPE_API_KEY / live LLM
    slow: tests that take >10s
    timeout: per-test timeout (no-op unless pytest-timeout is installed)
# CI gate runs: pytest -m "not docker and not llm"
