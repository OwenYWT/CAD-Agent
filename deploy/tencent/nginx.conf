# Host nginx; certificate is maintained by the existing ACME installation.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.wordswave.ai;
    ssl_certificate /www/server/panel/vhost/cert/www.wordswave.ai/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.wordswave.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2g;

    # Preserve the original URI and Host (including port) for S3 SigV4.
    # This bucket is private: MinIO verifies every signed request.
    location ~ ^/cad-native-artifacts(?:/|$) {
        proxy_pass http://127.0.0.1:59100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
