# CAD Agent — minimal single-host deploy.
# Prereq: build the sandbox image first (the backend spawns it per generation):
#   cd backend/sandbox && docker build -t cad-agent-sandbox:latest .
# Then: docker compose up -d
#
# NOTE: backend mounts the host docker.sock to run sandbox containers (sibling mode).
# This exposes the host Docker to the backend process — use only on a trusted host.

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # the sandbox image lives on the HOST docker, reachable via the mounted socket
      SANDBOX_IMAGE: cad-agent-sandbox:latest
      FILE_STORAGE_DIR: /app/data/files
      HISTORY_DB_PATH: /app/data/history.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cad_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cad_data:
