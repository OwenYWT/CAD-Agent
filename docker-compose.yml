# CAD Agent — minimal single-host deploy.
# Prereq: build the sandbox image from the repository root (the backend spawns
# it per generation):
#   docker build -f backend/sandbox/Dockerfile -t cad-agent-sandbox:dev .
# Then: docker compose up -d
#
# NOTE: backend mounts the host docker.sock to run sandbox containers (sibling mode).
# This exposes the host Docker to the backend process — use only on a trusted host.

services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cad_agent}
      POSTGRES_USER: ${POSTGRES_USER:-cad_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-cad-agent-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${OBJECT_STORE_BUCKET}"
        mc version enable "local/$${OBJECT_STORE_BUCKET}"
    restart: "no"

  temporal:
    # Local bootstrap only. Production uses managed Temporal or the supported
    # temporalio/server deployment with operator-owned schema migrations.
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-cad_agent}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-57233}:7233"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL with a URL-encoded password}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      # the sandbox image lives on the HOST docker, reachable via the mounted socket
      # Production must override this with registry/path@sha256:<digest>.
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-cad-agent-sandbox:dev}
      DURABLE_CONTROL_PLANE_ENABLED: ${DURABLE_CONTROL_PLANE_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL with a URL-encoded password}
      OBJECT_STORE_ENDPOINT_URL: ${OBJECT_STORE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-cad-agent-artifacts}
      TEMPORAL_TARGET: ${TEMPORAL_TARGET:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-cad-agent-mcad}
      TEMPORAL_AGENT_V2_TASK_QUEUE: ${TEMPORAL_AGENT_V2_TASK_QUEUE:-cad-agent-mcad-v2}
      FILE_STORAGE_DIR: /app/data/files
      HISTORY_DB_PATH: /app/data/history.db
      # Sibling kernel containers must see the same absolute input/output paths.
      TMPDIR: ${SANDBOX_WORK_DIR:-/tmp/cad-agent-work}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cad_data:/app/data
      - ${SANDBOX_WORK_DIR:-/tmp/cad-agent-work}:${SANDBOX_WORK_DIR:-/tmp/cad-agent-work}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  workflow-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-cad-agent-sandbox:dev}
      DURABLE_CONTROL_PLANE_ENABLED: ${DURABLE_CONTROL_PLANE_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL with a URL-encoded password}
      OBJECT_STORE_ENDPOINT_URL: ${OBJECT_STORE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-cad-agent-artifacts}
      TEMPORAL_TARGET: ${TEMPORAL_TARGET:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-cad-agent-mcad}
      TEMPORAL_AGENT_V2_TASK_QUEUE: ${TEMPORAL_AGENT_V2_TASK_QUEUE:-cad-agent-mcad-v2}
      FILE_STORAGE_DIR: /app/data/files
      HISTORY_DB_PATH: /app/data/history.db
      TMPDIR: ${SANDBOX_WORK_DIR:-/tmp/cad-agent-work}
    command: ["python", "-m", "app.workers.workflow_worker"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cad_data:/app/data
      - ${SANDBOX_WORK_DIR:-/tmp/cad-agent-work}:${SANDBOX_WORK_DIR:-/tmp/cad-agent-work}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cad_data:
  postgres_data:
  minio_data:
