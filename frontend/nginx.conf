map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The official image fills this from /etc/resolv.conf for Docker or Podman.
    # Resolve at request time so backend container replacement needs no reload.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
    resolver_timeout 5s;
    set $cad_backend http://backend:8000;
    proxy_connect_timeout 5s;

    # SPA: serve index.html for any non-file route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → backend
    location /api/ {
        proxy_pass $cad_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location = /health { proxy_pass $cad_backend; }
    location = /ready  { proxy_pass $cad_backend; }

    # WebSocket → backend (generation streaming)
    location /ws/ {
        proxy_pass $cad_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
