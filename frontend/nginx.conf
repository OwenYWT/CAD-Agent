map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The official image fills this from /etc/resolv.conf for Docker or Podman.
    # Resolve at request time so backend container replacement needs no reload.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
    resolver_timeout 5s;
    set $cad_backend http://backend:8000;
    proxy_connect_timeout 5s;

    # Release archives can give different HTML files the same mtime and size.
    # Nginx's metadata ETag would then reuse an old entry after a deployment.
    location = /index.html {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Vite assets have content hashes. Missing old chunks must never be served
    # as HTML through the SPA fallback.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA routes resolve to the non-cacheable entry above.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → backend
    location /api/ {
        proxy_pass $cad_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location = /health { proxy_pass $cad_backend; }
    location = /ready  { proxy_pass $cad_backend; }

    # WebSocket → backend (generation streaming)
    location /ws/ {
        proxy_pass $cad_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
